<!DOCTYPE html>
<html lang="en" data-theme="{{ theme if theme != 'auto' else 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · HostTalk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/base.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/marketing.css?v={{ static_v }}">
</head>
<body class="site">
  <main class="error-page">
    <div class="error-card">
      <a class="brand" href="/">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="var(--ink)"/>
          <rect class="mark-room" x="9" y="14" width="14" height="9" rx="1.5"/>
          <circle class="mark-dot" cx="22" cy="10" r="2.4"/>
        </svg>
        <span>HostTalk</span>
      </a>
      <p class="console-top__tag" style="margin-top:20px">{{ code }}</p>
      <h1>{{ title }}</h1>
      <p>{{ detail }}</p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="/room">Open the room</a>
        <a class="btn" href="/about">How it works</a>
      </div>
    </div>
  </main>
</body>
</html>
