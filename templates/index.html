<header>
  <h2 id="chat-header">Group Chat</h2>

      <img src="/static/theme26.webp"  def="icio">
    </choose>
    <choose action="16theme" p="ios 16" title="Apply ios 16 design to HostTalk">
      <img src="/static/theme16.webp"  def="icio">
    </choose>
    <choose action="6theme" p="ios 6" title="Apply ios 6 design to HostTalk">
      <img src="/static/theme6.webp" def="icio">

    <p>Border radius</p>
    <option-wrp f="c">
    <input value="19" type="range" min="10" max="50" event='input' action="fuh" range="border-radius">

        <p mine="yesvro">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
        <p mine="yesvro">Lorem ipsum dolor sit amet.</p></preview>
    </option-wrp>
    <p>Placeholder</p>
    <option-wrp>
      <div oc="p"><input placeholder="Enter a placeholder" tromoSM="placein" type="text"></div>
    </option-wrp>
    <p>Your Color</p>
    <option-wrp>
      <div id="color-picker-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 300px;"></div>
      <div style="margin-top: 8px; display: flex; gap: 8px; align-items: center;">
        <input type="color" id="custom-color" style="width: 40px; height: 40px; border: none; border-radius: 4px; cursor: pointer;">
        <button onclick="setCustomColor()" style="padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer;">Use Custom</button>
      </div>
    </option-wrp>
    <p>Logs</p>
    <option-wrp>
      <button onclick="viewLogs()" style="padding: 10px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%;">View Server Logs</button>
    </option-wrp>
    <p>Stickers & GIFs</p>
    <option-wrp>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="gif-search" placeholder="Search GIFs..." style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-input); color: var(--text);">
        <button onclick="searchGifs()" style="padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer;">Search</button>
      </div>
      <div id="gif-results" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 200px; overflow-y: auto;"></div>
    </option-wrp>
    <p>Profile</p>
    <option-wrp>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="nickname-input" placeholder="New nickname..." style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-input); color: var(--text);">
        <button onclick="changeNickname()" style="padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer;">Change</button>
      </div>
      <div id="nickname-cooldown" style="font-size: 0.8em; color: var(--text-muted); display: none;"></div>
      <button onclick="viewNicknameHistory()" style="margin-top: 8px; padding: 8px 16px; background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; width: 100%;">View Nickname History</button>
    </option-wrp>
    <p>LocalSend</p>
    <option-wrp>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button onclick="scanLocalSend()" style="padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer;">Scan for Devices</button>
        <button onclick="sendViaLocalSend()" style="padding: 8px 16px; background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer;">Send File via LocalSend</button>

      <div id="localsend-devices" style="max-height: 150px; overflow-y: auto;"></div>
    </option-wrp>
