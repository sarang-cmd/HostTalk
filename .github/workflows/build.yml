name: Build HostTalk Portable

# The portable build bundles the Python package plus templates and static files.
# It runs on a tag push, or by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --console `
          --name HostTalk-portable-edition `
          --icon icon.ico `
          --add-data "static;static" `
          --add-data "templates;templates" `
          --hidden-import "waitress" `
          server.py

      - uses: actions/upload-artifact@v4
        with:
          name: HostTalk-portable-edition-windows
          path: dist/HostTalk-portable-edition.exe


  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # PyInstaller wants .icns on macOS and Pillow is not installed here,
      # so build the icon set with the tools macOS ships.
      - name: Build the icon
        run: |
          mkdir -p HostTalk.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size static/icons/icon-512.png --out "HostTalk.iconset/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            sips -z $double $double static/icons/icon-512.png --out "HostTalk.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns HostTalk.iconset -o HostTalk.icns
          ls -la HostTalk.icns

      - name: Build macOS binary
        run: |
          pyinstaller --noconfirm --onefile --windowed \
          --name HostTalk-portable-edition \
          --icon HostTalk.icns \
          --add-data "static:static" \
          --add-data "templates:templates" \
          server.py

      - name: Create app bundle
        run: |
          mkdir -p HostTalk-portable-edition.app/Contents/MacOS
          cp dist/HostTalk-portable-edition HostTalk-portable-edition.app/Contents/MacOS/

      - name: Create DMG
        run: |
          hdiutil create -volname "HostTalk-portable-edition" \
          -srcfolder HostTalk-portable-edition.app \
          -ov -format UDZO HostTalk-portable-edition.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: HostTalk-portable-edition-macos
          path: HostTalk-portable-edition.dmg


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Linux binary
        run: |
          pyinstaller --noconfirm --onefile \
          --name HostTalk-portable-edition \
          --add-data "static:static" \
          --add-data "templates:templates" \
          server.py

      - uses: actions/upload-artifact@v4
        with:
          name: HostTalk-portable-edition-linux
          path: dist/HostTalk-portable-edition


  publish:
    # Attach the three builds to the GitHub release for this tag.
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what was built
        run: find artifacts -type f | sort

      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "HostTalk $TAG" --generate-notes
          while read -r file; do
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done < <(find artifacts -type f)
