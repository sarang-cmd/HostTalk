name: Build HostTalk

# Builds the desktop app and the server binary for Windows.
# Runs on a tag push, or by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build the desktop app
        run: |
          pyinstaller --noconfirm --onefile --windowed `
          --name HostTalk `
          --icon icon.ico `
          --add-data "static;static" `
          --add-data "templates;templates" `
          --hidden-import waitress `
          desktop.py

      - name: Build the server binary
        run: |
          pyinstaller --noconfirm --onefile --console `
          --name HostTalk-server `
          --icon icon.ico `
          --add-data "static;static" `
          --add-data "templates;templates" `
          --hidden-import waitress `
          server.py

      - uses: actions/upload-artifact@v4
        with:
          name: HostTalk-windows
          path: |
            dist/HostTalk.exe
            dist/HostTalk-server.exe
