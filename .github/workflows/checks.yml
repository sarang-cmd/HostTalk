name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check hosttalk tests

      - name: Tests
        run: pytest -q

      - name: Start the app and ask for health
        run: |
          python -m hosttalk setup --password ci-room-pass --room "CI room" \
            --port 7299 --data-dir "$RUNNER_TEMP/ht" --non-interactive
          HOSTTALK_HOME="$RUNNER_TEMP/ht" python -m hosttalk serve \
            --data-dir "$RUNNER_TEMP/ht" --port 7299 --host 127.0.0.1 --headless &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7299/healthz > /dev/null; then
              echo "health ok"; exit 0
            fi
            sleep 1
          done
          echo "server did not answer"; exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t hosttalk:ci .
