# Optional reverse proxy. Plain HTTP keeps this inside the LAN.
# Add TLS with a local certificate when a secure context is needed.
server {
    listen 80;
    server_name hosttalk.local;

    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:7284;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: no buffering, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
